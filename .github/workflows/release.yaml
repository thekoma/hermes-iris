name: Build and Release

on:
  push:
    branches: ["main"]
    tags: ["**"]
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "renovate.json"
      - "LICENSE"
  schedule:
    - cron: "0 3 * * *"  # nightly rebuild picks up upstream/digest changes
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/thekoma/hermes-iris

# `shell: bash` runs every step with `-e -o pipefail`, so a failing command in
# the middle of a pipeline fails the step instead of being masked by the exit
# status of the last one.
defaults:
  run:
    shell: bash

jobs:
  # -----------------------------------------------------------------
  # 1. Compute the tag once, on a single runner, share via outputs.
  # -----------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.calc.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Calculate next tag (YYYY.MM.N)
        id: calc
        run: |
          set -euo pipefail
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PREFIX=$(date +'%Y.%m')
          git fetch --tags
          LAST_TAG=$(git tag --list "${PREFIX}.*" | sort -V | tail -n 1)
          if [ -z "$LAST_TAG" ]; then
            NEW_TAG="${PREFIX}.0"
          else
            SUFFIX="${LAST_TAG#"${PREFIX}."}"
            # A stray tag like 2026.08.1-rc1 would make $((...)) fail with a
            # confusing arithmetic error under set -e.
            if [[ ! "$SUFFIX" =~ ^[0-9]+$ ]]; then
              echo "::error::cannot derive next tag: '$LAST_TAG' has non-numeric suffix '$SUFFIX'"
              exit 1
            fi
            NEW_SUFFIX=$((SUFFIX + 1))
            NEW_TAG="${PREFIX}.${NEW_SUFFIX}"
          fi
          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

  # -----------------------------------------------------------------
  # 2. Native per-arch builds (no QEMU): amd64 on ubuntu-latest,
  #    arm64 on ubuntu-24.04-arm. Each pushes a digest-only image;
  #    the merge job stitches them into a multi-arch manifest.
  # -----------------------------------------------------------------
  build:
    needs: prepare
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare platform pair
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # Per-arch artefact: no tag yet, just push the image by digest.
          # The merge job assembles the multi-arch tag list.
          # Plain gzip: estargz needs the stargz snapshotter and is flaky on
          # stock containerd; force-compression also re-compressed every
          # upstream base layer for nothing.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}
          sbom: true
          provenance: true

      - name: Export digest
        run: |
          set -euo pipefail
          digest="${{ steps.build.outputs.digest }}"
          # An empty digest would `touch` the directory itself and let the job
          # pass with nothing published for this platform.
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::build did not report a valid digest (got '$digest')"
            exit 1
          fi
          mkdir -p /tmp/digests
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # -----------------------------------------------------------------
  # 3. Stitch the per-arch digests into a single multi-arch manifest
  #    and apply the human-friendly tags. Then push a git tag.
  # -----------------------------------------------------------------
  merge:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the git tag
      packages: write   # push the manifest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.tag }}
            type=raw,value=latest
            type=schedule,pattern=latest-nightly

      - name: Create multi-arch manifest and push
        working-directory: /tmp/digests
        env:
          # Multi-line output: inlining it via ${{ }} would splice raw newlines
          # into the script and execute each tag as a command.
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          if [ -z "${TAGS//[[:space:]]/}" ]; then
            echo "::error::docker/metadata-action produced no tags"
            exit 1
          fi
          # Without nullglob an empty digests dir yields the literal '*' and we
          # would hand imagetools a bogus reference.
          shopt -s nullglob
          DIGEST_FILES=(*)
          if [ ${#DIGEST_FILES[@]} -eq 0 ]; then
            echo "::error::no per-arch digests were downloaded; nothing to stitch"
            exit 1
          fi
          # Arrays, not word-split strings: a tag or digest containing spaces
          # then fails loudly on the docker call instead of silently mangling
          # the argument list.
          TAG_FLAGS=()
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            TAG_FLAGS+=(-t "$tag")
          done <<< "$TAGS"
          # Each downloaded file's name is the per-arch digest. Reference all of them.
          REFS=()
          for d in "${DIGEST_FILES[@]}"; do
            REFS+=("${{ env.IMAGE }}@sha256:$d")
          done
          echo "Tags:  ${TAG_FLAGS[*]}"
          echo "Refs:  ${REFS[*]}"
          docker buildx imagetools create "${TAG_FLAGS[@]}" "${REFS[@]}"

      - name: Inspect resulting image
        run: |
          set -uo pipefail
          # GHCR is eventually consistent: a tag pushed moments ago can 404.
          # Retries are expected here, so no `set -e`; the loop exits 1 itself
          # when the tag never becomes visible.
          for i in 1 2 3 4 5; do
            docker buildx imagetools inspect ${{ env.IMAGE }}:${{ needs.prepare.outputs.tag }} && exit 0
            echo "Tag not visible yet, retrying in ${i}0s..."
            sleep "${i}0"
          done
          exit 1

      - name: Push git tag
        if: success() && github.ref_type != 'tag'
        run: |
          set -euo pipefail
          NEW_TAG=${{ needs.prepare.outputs.tag }}
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"
