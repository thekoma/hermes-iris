name: Buildx + ghcr.io login
description: Set up docker buildx and authenticate against ghcr.io.

inputs:
  username:
    description: ghcr.io username
    required: false
    default: ${{ github.actor }}
  password:
    description: ghcr.io token (usually secrets.GITHUB_TOKEN)
    required: true

runs:
  using: composite
  steps:
    - name: Set up Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to ghcr.io
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}
